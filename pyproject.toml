[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wgdrift"
version = "0.1.0"
description = "Runtime policy-drift detection and reconciliation for WireGuard gateways"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wgdrift = "wgdrift.cli:main"

[tool.setuptools.packages.find]
include = ["wgdrift*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
